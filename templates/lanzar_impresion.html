<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Lanzando impresión</title>
</head>
<body>
    <form id="form-imprimir" method="post" action="{{ print_url }}">
        <input type="hidden" name="_csrf_token" value="{{ csrf_token_value }}">
        <noscript><button type="submit">Continuar a impresión</button></noscript>
    </form>
    <script nonce="{{ csp_nonce }}">
        (function () {
            var volverUrl = "{{ volver_url }}";

            try {
                if (window.opener && !window.opener.closed) {
                    setTimeout(function () {
                        try {
                            window.opener.location.href = volverUrl;
                            setTimeout(function () {
                                try {
                                    window.opener.location.reload();
                                } catch (e) {}
                            }, 250);
                        } catch (e) {}
                    }, 150);
                }
            } catch (e) {}

            document.getElementById("form-imprimir").submit();
        })();
    </script>
</body>
</html>
