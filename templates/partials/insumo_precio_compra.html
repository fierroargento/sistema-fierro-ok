<label><span>Cotización del proveedor</span><select name="base_precio" data-cotizacion-insumo><option value="unitario"{% if presentacion.get('base_precio', 'unitario') == 'unitario' %} selected{% endif %}>Precio por unidad de medida</option><option value="bulto"{% if presentacion.get('base_precio') == 'bulto' %} selected{% endif %}>Precio por bulto</option></select></label>
<label data-precio-unitario><span>Precio unitario sin IVA</span><div class="money-input"><span>$</span><input name="precio_unitario" inputmode="decimal" placeholder="Por metro, unidad o medida indicada"></div></label>
<label data-precio-bulto><span>Precio por bulto sin IVA</span><div class="money-input"><span>$</span><input name="precio_bulto" inputmode="decimal" placeholder="Importe de la barra, caja o paquete"></div></label>
<label><span>Cantidad por bulto</span><input name="cantidad_bulto" data-cantidad-bulto inputmode="decimal" value="{{ presentacion.get('cantidad_bulto') if presentacion.get('cantidad_bulto') is not none else '' }}" placeholder="Ej. 6 metros o 500 unidades: solo el número"></label>
<label><span>Medidas de la presentación <small>opcional</small></span><input name="medidas_origen" maxlength="120" value="{{ presentacion.get('medidas_origen', '') }}" placeholder="Ej. placa 1,80 × 2,60 m"></label>
<p class="productos-muted" data-precio-insumo-ayuda role="status">El costo productivo usa el precio neto por unidad de medida. Solo se divide cuando la cotización es por bulto.</p>
