<div class="arca-lookup" data-arca-lookup>
  <button type="button" class="arca-consult" data-arca-consult>Consultar ARCA</button>
  <p class="arca-feedback" data-arca-feedback role="status" aria-live="polite">Consultá por CUIT para completar los datos fiscales.</p>
  <div class="arca-result" data-arca-result hidden>
    <h3>Datos de ARCA</h3>
    <dl data-arca-fields></dl>
    <p>Revisalos antes de aplicarlos. Email, teléfono y contacto se completan manualmente.</p>
    <label class="arca-replace"><input type="checkbox" data-arca-replace> Reemplazar también los datos que ya completé</label>
    <button type="button" class="arca-apply" data-arca-apply>Usar estos datos</button>
    <button type="button" class="arca-dismiss" data-arca-dismiss>Descartar</button>
  </div>
</div>
